name: NovelLex real novel LoRA v2 versus baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - training/novellex_real_v2.py
      - .github/workflows/real-novel-v2.yml

permissions:
  contents: read

jobs:
  train-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python and private input
        run: |
          python -m py_compile training/novellex_real_v2.py
          test -s private-data/novellex-private-input.zip || { echo 'Private data missing'; exit 1; }
      - name: Build annotated real-chapter windows and enforce holdout isolation
        run: |
          python training/novellex_real_v2.py prepare --output real_v2_output
      - name: Install pinned model and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'gliner2[train]==2.1.0'
      - name: Fine-tune GLiNER2.5 Small LoRA on actual novel passages
        run: |
          python training/novellex_real_v2.py train --output real_v2_output --steps 256
      - name: Compare baseline against new adapter (dev and withheld novel)
        run: |
          python training/novellex_real_v2.py compare --output real_v2_output --adapter real_v2_output/checkpoints/final
      - name: Export ONLY private adapter and aggregate metrics, never raw novel text
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: novellex-real-v2-private-adapter-and-comparison
          retention-days: 14
          if-no-files-found: error
          path: |
            real_v2_output/checkpoints/final/adapter_model.safetensors
            real_v2_output/checkpoints/final/adapter_config.json
            real_v2_output/data_summary.json
            real_v2_output/comparison_report.json
