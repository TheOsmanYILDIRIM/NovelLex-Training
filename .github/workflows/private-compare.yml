name: Compare private NovelLex base vs LoRA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private input
        run: test -s private-data/novellex-private-input.zip
      - name: Download verified private training artifact
        run: |
          mkdir -p adapter-download
          gh run download 42865529793 --repo "$GITHUB_REPOSITORY" --name novellex-private-provisional-adapter --dir adapter-download
          test -s adapter-download/checkpoints/final/adapter_model.safetensors
          test -s adapter-download/checkpoints/final/adapter_config.json
      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gliner2[train]==2.1.0"
      - name: Compare same held-out provisional positives
        run: python training/compare_private.py --adapter adapter-download/checkpoints/final
      - name: Save metrics only (private)
        uses: actions/upload-artifact@v4
        with:
          name: novellex-private-positive-holdout-comparison
          retention-days: 14
          path: comparison_output/comparison_report.json
